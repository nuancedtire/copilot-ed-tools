<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Copilot Test Fixture</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #fafafa;
    }
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .composer-bar {
      padding: 12px 16px 16px;
      border-top: 1px solid #e0e0e0;
      background: #fff;
    }
    #m365-chat-input-shared-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid #d1d1d1;
      border-radius: 12px;
      background: #f5f5f5;
    }
    #m365-chat-input-shared-wrapper [contenteditable] {
      flex: 1;
      min-height: 40px;
      max-height: 200px;
      overflow-y: auto;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      outline: none;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }
    #m365-chat-input-shared-wrapper [contenteditable]:empty::before {
      content: 'Type a message…';
      color: #999;
    }
    .send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: #0078d4;
      color: #fff;
      cursor: pointer;
      font-size: 18px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
    }
    .send-btn:hover { background: #005a9e; }
  </style>
</head>
<body>
  <!-- Chat message area -->
  <div data-testid="chat-conversation" role="log" class="chat-area">
    <div>Pre-existing message from user</div>
  </div>

  <!-- Composer bar with Copilot-identifiable wrapper -->
  <div class="composer-bar">
    <div id="m365-chat-input-shared-wrapper">
      <div contenteditable="true" role="textbox" aria-label="Message input"></div>
      <button class="send-btn" aria-label="Send message" data-testid="send-button">↑</button>
    </div>
  </div>

  <!-- chrome mock → prompts → content (same order as manifest) -->
  <link rel="stylesheet" href="/styles.css">
  <script src="/tests/fixtures/chrome-mock.js"></script>
  <script>window.__ED_TOOLS_TEST__ = true;</script>
  <script src="/prompts.js"></script>
  <script src="/content.js"></script>
</body>
</html>
